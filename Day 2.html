<body>
    <h3>Lists</h3> <br>

     Unordered:
     <ul>
        <h5>List:</h5>
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam </li>
     </ul>

     Ordered:
     <ol>
        <li>Pavbhaji</li>
        <li>Dabeli</li>
        <li>Bhel</li>
     </ol>
     
     <u>attribute:</u> it is used to add more info to the tag <br>
     we can change the type of ordered list using: type="A" or type="a"
     <ol type="A">
        <li>Pavbhaji</li>
        <li>Dabeli</li>
        <li>Bhel</li>
     </ol>
    
    anchor tag:<br>
    <a href="https://www.google.com/">Google</a>



</body>
