<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
   <h3>Lists</h3> <br>

   Unordered:
    <ul>
      <h5>List:</h5>
      <li>Bread</li>
      <li>Butter</li>
      <li>Jam </li>
    </ul>

   Ordered:
     <ol>
        <li>Pizza</li>
        <li>Sandwich</li>
        <li>Burger</li>
     </ol>
     
   <h3>attribute:</h3> it is used to add more info to the tag <br>
    we can change the type of ordered list using: type="A" or type="a"
     <ol type="A">
        <li>Pizza</li>
        <li>Sandwich</li>
        <li>Burger</li>
     </ol>
    
   <h3>anchor tag:</h3>
   <a href="https://www.google.com/">Google</a>






</body>
</html>
